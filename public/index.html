<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Voice Studio - Ultimate</title>
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background: #0f0c29;
            background: linear-gradient(to right, #24243e, #302b63, #0f0c29);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Background Animation Canvas */
        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 40px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            position: relative;
            z-index: 10;
        }

        h1 {
            text-align: center;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
            background: linear-gradient(to right, #00d2ff, #928DAB);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 0.9em;
            margin-bottom: 40px;
        }

        /* Form Elements */
        .group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #ccc; font-size: 0.9em; }

        select, input[type="password"], textarea {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        select:focus, input[type="password"]:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        select option {
            background: #141E30;
            color: white;
            padding: 10px;
        }

        /* Sliders */
        .slider-container {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .slider-box {
            flex: 1;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85em;
            color: #bbb;
        }

        .slider-value {
            color: var(--primary);
            font-weight: bold;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            transition: 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 10px var(--primary);
        }

        /* Toggle API Key Section */
        #apiKeySection {
            display: none;
            background: rgba(255, 200, 0, 0.05);
            padding: 20px;
            border-radius: 10px;
            border: 1px dashed rgba(255, 215, 0, 0.3);
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(45deg, var(--secondary), var(--primary));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 210, 255, 0.3);
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Audio Player Styling */
        .result-box {
            margin-top: 30px;
            text-align: center;
            display: none;
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--border);
        }
        
        audio {
            width: 100%;
            height: 40px;
            margin-bottom: 15px;
        }
        
        .download-btn {
            display: inline-block;
            text-decoration: none;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 10px 30px;
            border-radius: 30px;
            transition: 0.3s;
            font-weight: bold;
        }
        
        .download-btn:hover {
            background: var(--primary);
            color: white;
        }

        .status {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9em;
            color: #888;
        }
    </style>
</head>
<body>

<canvas id="canvas-bg"></canvas>

<div class="container">
    <h1>Crystal Voice Studio</h1>
    <p class="subtitle">Ultimate AI Text-to-Speech Generator</p>

    <div class="group">
        <label>Pilih Suara / Voice Model</label>
        <select id="voiceSelect" onchange="checkVoiceType()">
            <optgroup label="💎 PREMIUM ELEVENLABS (REALISTIS)">
                <option value="pNInz6obpgDQGcFmaJgB" data-provider="elevenlabs">👨 Adam (Pria - Bahasa Indonesia)</option>
                <option value="ErXwobaYiN019PkySvjV" data-provider="elevenlabs">👨 Antoni (Pria Muda - Bahasa Indonesia)</option>
                <option value="EXAVITQu4vr4xnSDxMaL" data-provider="elevenlabs">👩 Bella (Perempuan - English Native)</option>
            </optgroup>

            <optgroup label="🚀 GRATIS (GOOGLE FALLBACK)">
                <option value="id" data-provider="google">🇮🇩 Indonesia (Mbak Google)</option>
                <option value="en" data-provider="google">🇺🇸 Inggris (US)</option>
            </optgroup>
        </select>
    </div>

    <!-- PENGATURAN SUARA (PITCH & SPEED) -->
    <div class="slider-container">
        <div class="slider-box">
            <div class="slider-header">
                <span>Kecepatan (Tempo)</span>
                <span class="slider-value" id="speedVal">1.0x</span>
            </div>
            <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.1" value="1.0" oninput="updateSliders()">
        </div>
        <div class="slider-box">
            <div class="slider-header">
                <span>Pita Suara (Stabilitas)</span>
                <span class="slider-value" id="pitchVal">Normal</span>
            </div>
            <!-- Menggunakan ini untuk merubah karakter / stabilitas AI di backend (0.1 - 1.0) -->
            <input type="range" id="pitchSlider" min="0.1" max="1.0" step="0.1" value="0.5" oninput="updateSliders()">
        </div>
    </div>

    <div id="apiKeySection" class="group">
        <label>🔑 API Key ElevenLabs (Opsional)</label>
        <input type="password" id="userApiKey" placeholder="sk_... (Biarkan kosong jika ingin pakai Kuota Server Gratis)">
        <small style="color: #bbb; display: block; margin-top: 5px;">
            *Jika kosong, sistem akan mencoba menggunakan akun Estafet Vercel.
        </small>
    </div>

    <div class="group">
        <label>Naskah / Teks</label>
        <textarea id="textInput" rows="6" placeholder="Ketik narasi Anda di sini..."></textarea>
        <div style="text-align: right; font-size: 12px; color: #888; margin-top: 5px;">
            <span id="charCount">0</span> Karakter
        </div>
    </div>

    <button id="generateBtn" onclick="generateAudio()">✨ Generate Voice</button>
    <div id="statusText" class="status"></div>

    <div class="result-box" id="resultArea">
        <audio id="audioPlayer" controls></audio><br>
        <a id="downloadLink" class="download-btn" download>⬇ Download MP3</a>
    </div>
</div>

<script>
    // --- 1. ANIMASI LATAR BELAKANG (ANGEL LINES / CRYSTAL) ---
    const canvas = document.getElementById("canvas-bg");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 0.5;
            this.vy = (Math.random() - 0.5) * 0.5;
            this.size = Math.random() * 2;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
            if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        }
        draw() {
            ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    for (let i = 0; i < 70; i++) particles.push(new Particle());

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
            for (let j = i; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < 150) {
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(0, 210, 255, ${1 - distance / 150})`;
                    ctx.lineWidth = 0.5;
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(animate);
    }
    animate();

    // --- 2. LOGIKA UTAMA APLIKASI ---
    const voiceSelect = document.getElementById('voiceSelect');
    const apiKeySection = document.getElementById('apiKeySection');
    const textInput = document.getElementById('textInput');
    const charCount = document.getElementById('charCount');
    const speedSlider = document.getElementById('speedSlider');
    const pitchSlider = document.getElementById('pitchSlider');

    // Update Label Slider
    function updateSliders() {
        document.getElementById('speedVal').innerText = parseFloat(speedSlider.value).toFixed(1) + "x";
        
        let pitchText = "Normal";
        let pitchVal = parseFloat(pitchSlider.value);
        if (pitchVal < 0.4) pitchText = "Sangat Ekspresif";
        else if (pitchVal > 0.7) pitchText = "Datar/Kaku";
        document.getElementById('pitchVal').innerText = pitchText;
    }

    // Cek Provider
    function checkVoiceType() {
        const selectedOption = voiceSelect.options[voiceSelect.selectedIndex];
        const provider = selectedOption.getAttribute('data-provider');
        
        if (provider === 'elevenlabs') {
            apiKeySection.style.display = 'block';
            const savedKey = localStorage.getItem('user_eleven_key');
            if (savedKey) document.getElementById('userApiKey').value = savedKey;
        } else {
            apiKeySection.style.display = 'none';
        }
    }
    
    textInput.addEventListener('input', () => {
        charCount.innerText = textInput.value.length;
    });

    window.onload = () => {
        checkVoiceType();
        updateSliders();
    };

    async function generateAudio() {
        const text = textInput.value;
        const selectedOption = voiceSelect.options[voiceSelect.selectedIndex];
        const voiceId = selectedOption.value;
        const provider = selectedOption.getAttribute('data-provider');
        const userKey = document.getElementById('userApiKey').value;
        const speedValue = parseFloat(speedSlider.value);
        const pitchValue = parseFloat(pitchSlider.value);

        if (!text) {
            document.getElementById('statusText').innerText = "❌ Mohon isi teks terlebih dahulu.";
            document.getElementById('statusText').style.color = "#ff6b6b";
            return;
        }
        
        if (provider === 'elevenlabs' && userKey) {
            localStorage.setItem('user_eleven_key', userKey);
        }

        const btn = document.getElementById('generateBtn');
        const statusText = document.getElementById('statusText');
        const resultArea = document.getElementById('resultArea');
        
        btn.disabled = true;
        btn.innerText = "⏳ Sedang Memproses...";
        statusText.innerText = "Membuat Mahakarya Suara...";
        statusText.style.color = "#00d2ff";
        resultArea.style.display = 'none';

        try {
            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    text: text,
                    voice_id: voiceId,
                    provider: provider,
                    user_api_key: userKey,
                    // Mengirimkan nilai slider ke backend jika dibutuhkan (sebagai stabilitas)
                    stability: pitchValue 
                })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error || "Gagal generate");
            }

            const blob = await response.blob();
            const audioUrl = URL.createObjectURL(blob);

            const audioPlayer = document.getElementById('audioPlayer');
            const downloadLink = document.getElementById('downloadLink');
            
            audioPlayer.src = audioUrl;
            
            // Mengaplikasikan pengaturan Kecepatan langsung ke Audio Player
            audioPlayer.playbackRate = speedValue;
            audioPlayer.play();
            
            downloadLink.href = audioUrl;
            downloadLink.download = `CrystalVoice-${Date.now()}.mp3`;

            resultArea.style.display = 'block';
            statusText.innerText = `✅ Selesai! (Diputar dalam mode Kecepatan ${speedValue}x)`;
            statusText.style.color = "#34a853";

        } catch (error) {
            statusText.innerText = "❌ Gagal: " + error.message;
            statusText.style.color = "#ff6b6b";
        } finally {
            btn.disabled = false;
            btn.innerText = "✨ Generate Voice";
        }
    }
</script>

</body>
</html>
