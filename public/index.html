<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Voice Studio - Ultimate</title>
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --panel-bg: rgba(0, 0, 0, 0.25);
        }

        body {
            margin: 0;
            padding: 0;
            background: #0f0c29;
            background: linear-gradient(to right, #24243e, #302b63, #0f0c29);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
        }

        #canvas-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 35px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            position: relative;
            z-index: 10;
        }

        h1 {
            text-align: center; font-weight: 300; letter-spacing: 2px;
            margin-bottom: 5px; text-transform: uppercase;
            background: linear-gradient(to right, #00d2ff, #928DAB);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .subtitle { text-align: center; color: #aaa; font-size: 0.9em; margin-bottom: 30px; }

        .group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #ccc; font-size: 0.9em; }

        select, input[type="password"], textarea {
            width: 100%; padding: 15px; background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border); border-radius: 10px;
            color: white; font-size: 16px; outline: none; transition: 0.3s; box-sizing: border-box;
        }
        select:focus, input[type="password"]:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 210, 255, 0.2); }
        select option { background: #141E30; color: white; padding: 10px; }

        /* ADVANCED SETTINGS PANEL (ELEVENLABS STYLE) */
        .settings-panel {
            background: var(--panel-bg);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
        }

        .setting-item { margin-bottom: 20px; }
        .setting-item:last-child { margin-bottom: 0; }

        .setting-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px;
        }
        .setting-title { font-weight: bold; font-size: 0.95em; color: #fff; }
        .setting-val { font-size: 0.8em; color: var(--primary); background: rgba(0,210,255,0.1); padding: 3px 8px; border-radius: 12px; }

        .slider-labels {
            display: flex; justify-content: space-between;
            font-size: 0.75em; color: #888; margin-top: 5px;
        }

        input[type="range"] {
            -webkit-appearance: none; width: 100%; height: 6px;
            background: rgba(255,255,255,0.1); border-radius: 5px; outline: none; margin-top: 5px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
            background: var(--primary); cursor: pointer; transition: 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.3); box-shadow: 0 0 10px var(--primary); }

        /* TOGGLE SWITCH */
        .toggle-container {
            display: flex; justify-content: space-between; align-items: center;
            padding-top: 10px; border-top: 1px solid var(--border);
        }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-toggle {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #555; transition: .4s; border-radius: 34px;
        }
        .slider-toggle:before {
            position: absolute; content: ""; height: 16px; width: 16px;
            left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider-toggle { background-color: var(--primary); }
        input:checked + .slider-toggle:before { transform: translateX(18px); }

        /* API Key Section */
        #apiKeySection { display: none; background: rgba(255, 200, 0, 0.05); padding: 20px; border-radius: 10px; border: 1px dashed rgba(255, 215, 0, 0.3); }

        button.btn-generate {
            width: 100%; padding: 18px; background: linear-gradient(45deg, var(--secondary), var(--primary));
            border: none; border-radius: 12px; color: white; font-size: 18px; font-weight: bold;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; text-transform: uppercase; letter-spacing: 1px;
        }
        button.btn-generate:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0, 210, 255, 0.3); }
        button.btn-generate:disabled { background: #555; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Audio Player */
        .result-box { margin-top: 30px; text-align: center; display: none; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 15px; border: 1px solid var(--border); }
        audio { width: 100%; height: 40px; margin-bottom: 15px; }
        .download-btn { display: inline-block; text-decoration: none; color: var(--primary); border: 1px solid var(--primary); padding: 10px 30px; border-radius: 30px; font-weight: bold; transition: 0.3s; }
        .download-btn:hover { background: var(--primary); color: white; }
        .status { text-align: center; margin-top: 15px; font-size: 0.9em; color: #888; }
    </style>
</head>
<body>

<canvas id="canvas-bg"></canvas>

<div class="container">
    <h1>Crystal Voice Studio</h1>
    <p class="subtitle">Advanced Text-to-Speech Settings</p>

    <div class="group">
        <label>Pilih Suara / Voice Model</label>
        <select id="voiceSelect" onchange="checkVoiceType()">
            <optgroup label="💎 PREMIUM ELEVENLABS (REALISTIS)">
                <option value="pNInz6obpgDQGcFmaJgB" data-provider="elevenlabs">👨 Adam (Pria - Indonesia)</option>
                <option value="ErXwobaYiN019PkySvjV" data-provider="elevenlabs">👨 Antoni (Pria Muda - Indonesia)</option>
                <option value="EXAVITQu4vr4xnSDxMaL" data-provider="elevenlabs">👩 Bella (Perempuan - English)</option>
            </optgroup>
            <optgroup label="🚀 GRATIS (GOOGLE TTS)">
                <option value="id" data-provider="google">🇮🇩 Indonesia (Mbak Google)</option>
                <option value="en" data-provider="google">🇺🇸 Inggris (US)</option>
            </optgroup>
        </select>
    </div>

    <!-- ADVANCED SETTINGS PANEL -->
    <div class="settings-panel">
        
        <!-- 1. SPEED -->
        <div class="setting-item">
            <div class="setting-header">
                <span class="setting-title">Speed</span>
                <span class="setting-val" id="valSpeed">1.0x</span>
            </div>
            <input type="range" id="paramSpeed" min="0.5" max="2.0" step="0.1" value="1.0" oninput="updateUI()">
            <div class="slider-labels"><span>Slower</span><span>Faster</span></div>
        </div>

        <!-- Tiga Pengaturan di bawah ini disembunyikan jika pilih Google -->
        <div id="elevenSpecificSettings">
            <!-- 2. STABILITY -->
            <div class="setting-item">
                <div class="setting-header">
                    <span class="setting-title">Stability</span>
                    <span class="setting-val" id="valStability">50%</span>
                </div>
                <input type="range" id="paramStability" min="0" max="1" step="0.01" value="0.50" oninput="updateUI()">
                <div class="slider-labels"><span>More variable</span><span>More stable</span></div>
            </div>

            <!-- 3. SIMILARITY -->
            <div class="setting-item">
                <div class="setting-header">
                    <span class="setting-title">Similarity</span>
                    <span class="setting-val" id="valSimilarity">75%</span>
                </div>
                <input type="range" id="paramSimilarity" min="0" max="1" step="0.01" value="0.75" oninput="updateUI()">
                <div class="slider-labels"><span>Low</span><span>High</span></div>
            </div>

            <!-- 4. STYLE EXAGGERATION -->
            <div class="setting-item">
                <div class="setting-header">
                    <span class="setting-title">Style Exaggeration</span>
                    <span class="setting-val" id="valStyle">0%</span>
                </div>
                <input type="range" id="paramStyle" min="0" max="1" step="0.01" value="0.00" oninput="updateUI()">
                <div class="slider-labels"><span>None</span><span>Exaggerated</span></div>
            </div>

            <!-- 5. SPEAKER BOOST -->
            <div class="setting-item toggle-container">
                <span class="setting-title">Speaker boost</span>
                <label class="switch">
                    <input type="checkbox" id="paramBoost" checked>
                    <span class="slider-toggle"></span>
                </label>
            </div>
        </div>
    </div>

    <div id="apiKeySection" class="group">
        <label>🔑 API Key ElevenLabs</label>
        <input type="password" id="userApiKey" placeholder="sk_... (Masukkan API key barumu di sini)">
    </div>

    <div class="group">
        <label>Naskah / Teks</label>
        <textarea id="textInput" rows="5" placeholder="Ketik narasi Anda di sini..."></textarea>
        <div style="text-align: right; font-size: 12px; color: #888; margin-top: 5px;">
            <span id="charCount">0</span> Karakter
        </div>
    </div>

    <button id="generateBtn" class="btn-generate" onclick="generateAudio()">✨ Generate Voice</button>
    <div id="statusText" class="status"></div>

    <div class="result-box" id="resultArea">
        <audio id="audioPlayer" controls></audio><br>
        <a id="downloadLink" class="download-btn" download>⬇ Download MP3</a>
    </div>
</div>

<script>
    // Animasi Latar Belakang
    const canvas = document.getElementById("canvas-bg");
    const ctx = canvas.getContext("2d");
    let particles = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener("resize", resize); resize();
    class Particle {
        constructor() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.vx = (Math.random() - 0.5) * 0.5; this.vy = (Math.random() - 0.5) * 0.5; this.size = Math.random() * 2; }
        update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > canvas.width) this.vx *= -1; if (this.y < 0 || this.y > canvas.height) this.vy *= -1; }
        draw() { ctx.fillStyle = "rgba(255, 255, 255, 0.5)"; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
    }
    for (let i = 0; i < 70; i++) particles.push(new Particle());
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particles.length; i++) {
            particles[i].update(); particles[i].draw();
            for (let j = i; j < particles.length; j++) {
                const distance = Math.sqrt((particles[i].x - particles[j].x) ** 2 + (particles[i].y - particles[j].y) ** 2);
                if (distance < 150) { ctx.beginPath(); ctx.strokeStyle = `rgba(0, 210, 255, ${1 - distance / 150})`; ctx.lineWidth = 0.5; ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); }
            }
        } requestAnimationFrame(animate);
    } animate();

    // Logika UI Update
    function updateUI() {
        document.getElementById('valSpeed').innerText = parseFloat(document.getElementById('paramSpeed').value).toFixed(1) + "x";
        document.getElementById('valStability').innerText = Math.round(document.getElementById('paramStability').value * 100) + "%";
        document.getElementById('valSimilarity').innerText = Math.round(document.getElementById('paramSimilarity').value * 100) + "%";
        document.getElementById('valStyle').innerText = Math.round(document.getElementById('paramStyle').value * 100) + "%";
    }

    function checkVoiceType() {
        const provider = voiceSelect.options[voiceSelect.selectedIndex].getAttribute('data-provider');
        const apiKeySection = document.getElementById('apiKeySection');
        const elevenSettings = document.getElementById('elevenSpecificSettings');
        
        if (provider === 'elevenlabs') {
            apiKeySection.style.display = 'block';
            elevenSettings.style.display = 'block';
            const savedKey = localStorage.getItem('user_eleven_key');
            if (savedKey) document.getElementById('userApiKey').value = savedKey;
        } else {
            apiKeySection.style.display = 'none';
            elevenSettings.style.display = 'none'; // Sembunyikan pengaturan ElevenLabs jika pakai Google
        }
    }

    const voiceSelect = document.getElementById('voiceSelect');
    const textInput = document.getElementById('textInput');
    textInput.addEventListener('input', () => { document.getElementById('charCount').innerText = textInput.value.length; });

    window.onload = () => { checkVoiceType(); updateUI(); };

    // Logika Generate
    async function generateAudio() {
        const text = textInput.value;
        const selectedOption = voiceSelect.options[voiceSelect.selectedIndex];
        const provider = selectedOption.getAttribute('data-provider');
        
        if (!text) { alert("Mohon isi teks narasi!"); return; }

        const payload = {
            text: text,
            voice_id: selectedOption.value,
            provider: provider,
            user_api_key: document.getElementById('userApiKey').value,
            // Parameter Advanced ElevenLabs (Dikirim ke Backend)
            stability: parseFloat(document.getElementById('paramStability').value),
            similarity_boost: parseFloat(document.getElementById('paramSimilarity').value),
            style: parseFloat(document.getElementById('paramStyle').value),
            use_speaker_boost: document.getElementById('paramBoost').checked
        };

        if (provider === 'elevenlabs' && payload.user_api_key) {
            localStorage.setItem('user_eleven_key', payload.user_api_key);
        }

        const btn = document.getElementById('generateBtn');
        const statusText = document.getElementById('statusText');
        
        btn.disabled = true; btn.innerText = "⏳ Sedang Memproses...";
        statusText.innerText = "Menghasilkan keajaiban suara...";
        document.getElementById('resultArea').style.display = 'none';

        try {
            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error || "Gagal generate");
            }

            const blob = await response.blob();
            const audioUrl = URL.createObjectURL(blob);
            const audioPlayer = document.getElementById('audioPlayer');
            
            audioPlayer.src = audioUrl;
            
            // Terapkan fitur "Speed" (Kecepatan) pada Audio Player
            // Ini berfungsi untuk ElevenLabs DAN Google TTS!
            audioPlayer.playbackRate = parseFloat(document.getElementById('paramSpeed').value);
            
            audioPlayer.play();
            document.getElementById('downloadLink').href = audioUrl;
            document.getElementById('downloadLink').download = `Voice-${Date.now()}.mp3`;

            document.getElementById('resultArea').style.display = 'block';
            statusText.innerText = "✅ Berhasil! Suara siap didengar.";

        } catch (error) {
            statusText.innerText = "❌ Error: " + error.message;
        } finally {
            btn.disabled = false; btn.innerText = "✨ Generate Voice";
        }
    }
</script>
</body>
</html>
