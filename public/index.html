<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Studio - Unlimited & Premium</title>
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --bg-dark: #0f0c29;
            --glass: rgba(255, 255, 255, 0.08);
        }
        body {
            margin: 0; padding: 0;
            background: linear-gradient(to bottom right, #141E30, #243B55);
            font-family: 'Segoe UI', sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 90%;
            max-width: 600px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        h1 { text-align: center; margin-bottom: 5px; font-weight: 300; letter-spacing: 2px; }
        p.sub { text-align: center; color: #aaa; margin-bottom: 30px; font-size: 0.9em; }
        
        label { display: block; margin: 15px 0 5px; color: #ccc; font-size: 0.9em; }
        select, textarea, input {
            width: 100%; padding: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white; font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        select option { background: #141E30; }
        
        .api-box {
            display: none; /* Hidden by default */
            background: rgba(255, 193, 7, 0.1);
            padding: 15px; border-radius: 8px;
            border: 1px dashed #ffc107;
            margin-top: 10px;
        }

        button {
            margin-top: 25px;
            width: 100%; padding: 15px;
            background: linear-gradient(45deg, var(--secondary), var(--primary));
            border: none; border-radius: 10px;
            color: white; font-size: 18px; font-weight: bold;
            cursor: pointer; transition: 0.3s;
        }
        button:hover { transform: scale(1.02); box-shadow: 0 0 15px var(--primary); }
        button:disabled { background: #555; transform: none; cursor: not-allowed; }

        .result-area { margin-top: 25px; text-align: center; display: none; }
        audio { width: 100%; margin-bottom: 10px; }
        .dl-btn { color: var(--primary); text-decoration: none; border: 1px solid var(--primary); padding: 8px 20px; border-radius: 20px; display: inline-block; margin-top: 5px; }
        .dl-btn:hover { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>Crystal Voice</h1>
    <p class="sub">Generator Suara AI Unlimited & Premium</p>

    <label>Pilih Suara:</label>
    <select id="voiceSelect" onchange="checkProvider()">
        <optgroup label="🚀 GRATIS & UNLIMITED (Mbak Google/TikTok)">
            <option value="id-ID-GadisNeural" data-provider="edge">🇮🇩 Gadis (Cewek Halus - Recommended)</option>
            <option value="id-ID-ArdiNeural" data-provider="edge">🇮🇩 Ardi (Cowok Berita)</option>
            <option value="en-US-JennyNeural" data-provider="edge">🇺🇸 Jenny (English US)</option>
            <option value="en-US-GuyNeural" data-provider="edge">🇺🇸 Guy (English Male)</option>
        </optgroup>
        <optgroup label="💎 PREMIUM (Butuh API Key)">
            <option value="pNInz6obpgDQGcFmaJgB" data-provider="elevenlabs">⭐ Adam (Narator Berat)</option>
            <option value="21m00Tcm4TlvDq8ikWAM" data-provider="elevenlabs">⭐ Rachel (Storytelling)</option>
            <option value="ErXwobaYiN019Pky1sPO" data-provider="elevenlabs">⭐ Antoni (Formal)</option>
        </optgroup>
    </select>

    <div id="apiKeyBox" class="api-box">
        <label style="margin-top:0">🔑 Masukkan API Key ElevenLabs (Opsional):</label>
        <input type="password" id="userApiKey" placeholder="sk_... (Biarkan kosong jika ingin pakai server gratis)">
        <small style="color:#aaa; font-size:12px;">*Jika kosong, sistem akan mencoba menggunakan kuota server bersama.</small>
    </div>

    <label>Teks:</label>
    <textarea id="textInput" rows="5" placeholder="Ketik teks di sini... (Untuk mode Gratis bisa panjang sepuasnya)"></textarea>

    <button id="generateBtn" onclick="generateVoice()">✨ GENERATE SUARA</button>
    <p id="status" style="text-align:center; font-size:14px; color:#888; margin-top:10px;"></p>

    <div id="resultArea" class="result-area">
        <audio id="audioPlayer" controls></audio><br>
        <a id="downloadLink" class="dl-btn" download>⬇ Download MP3</a>
    </div>
</div>

<script>
    const voiceSelect = document.getElementById('voiceSelect');
    const apiKeyBox = document.getElementById('apiKeyBox');

    // Cek apakah user pilih Gratis atau Premium
    function checkProvider() {
        const option = voiceSelect.options[voiceSelect.selectedIndex];
        const provider = option.getAttribute('data-provider');
        if (provider === 'elevenlabs') {
            apiKeyBox.style.display = 'block';
        } else {
            apiKeyBox.style.display = 'none';
        }
    }

    async function generateVoice() {
        const text = document.getElementById('textInput').value;
        const option = voiceSelect.options[voiceSelect.selectedIndex];
        const voiceId = option.value;
        const provider = option.getAttribute('data-provider');
        const userApiKey = document.getElementById('userApiKey').value;

        if (!text) return alert("Mohon isi teksnya dulu kawan!");

        const btn = document.getElementById('generateBtn');
        const status = document.getElementById('status');
        const resultArea = document.getElementById('resultArea');

        btn.disabled = true;
        btn.innerText = "⏳ Sedang Meracik...";
        status.innerText = provider === 'edge' ? "Menghubungi Server Unlimited..." : "Menghubungi ElevenLabs...";
        resultArea.style.display = 'none';

        try {
            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    text: text, 
                    voice_id: voiceId, 
                    provider: provider,
                    user_api_key: userApiKey
                })
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.error || "Gagal memproses.");
            }

            const blob = await response.blob();
            const url = URL.createObjectURL(blob);

            document.getElementById('audioPlayer').src = url;
            document.getElementById('audioPlayer').play();
            document.getElementById('downloadLink').href = url;
            document.getElementById('downloadLink').download = `Audio-${Date.now()}.mp3`;

            resultArea.style.display = 'block';
            status.innerText = "✅ Berhasil!";
        } catch (e) {
            alert("Error: " + e.message);
            status.innerText = "❌ Gagal: " + e.message;
        } finally {
            btn.disabled = false;
            btn.innerText = "✨ GENERATE SUARA";
        }
    }
</script>

</body>
</html>
